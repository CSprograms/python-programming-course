# Netlify configuration for the UCAM11I Python Programming Session Viewer.
#
# Deployment model: Netlify's own Git integration (connect the repo once in
# the Netlify dashboard). On every push to `main` Netlify runs build_data.py,
# which regenerates web-app/data/sessions.json from Session_Programs/, and
# then publishes the static web-app/ folder. No secrets or GitHub Actions
# deploy step are needed.

[build]
  command = "python3 build_data.py"
  publish = "web-app"

# `netlify dev` — serves web-app/ as a static site on http://localhost:8888
[dev]
  framework = "#static"
  publish   = "web-app"
  port      = 8888

# ---------------------------------------------------------------------------
# Security headers (all paths)
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# ---------------------------------------------------------------------------
# Caching
# app.js / style.css / sessions.json are NOT fingerprinted (their names never
# change), so they must be revalidated on every visit; otherwise students
# would keep seeing old code for a long time after an update. Netlify's ETags
# make revalidation cheap (304 Not Modified when nothing changed).
# ---------------------------------------------------------------------------
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# No SPA catch-all redirect: the app routes with URL hashes (#session-12), so
# every page is served by /index.html already. A catch-all would make a
# missing file (e.g. data/sessions.json) return index.html with status 200
# and hide the real error. Unknown paths get web-app/404.html instead.
